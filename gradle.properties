# Project-wide Gradle settings.
# Specifies the JVM arguments used for the daemon process to prevent OutOfMemoryError.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style for this project
kotlin.code.style=official

# Enables namespacing of each library's R class
android.nonTransitiveRClass=true

# Allow KSP code generator with built-in Kotlin in AGP 9.1
android.disallowKotlinSourceSets=false

# Enable parallel and caching features for fast CI builds
org.gradle.parallel=true
org.gradle.caching=true
